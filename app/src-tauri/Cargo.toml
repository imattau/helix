[package]
name = "app"
version = "0.2.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-barcode-scanner = "2"
# Raw TCP sockets exposed to the webview frontend - pure Rust/tokio, no native Kotlin/
# Swift module, so it cross-compiles for Android like any other Rust dependency. Lets
# the app get a real, LAN-dialable (and WAN-dialable given port forwarding) listen
# address instead of depending purely on circuit-relay reservations - see
# app/src/backend/tauriTcpTransport.ts.
tauri-plugin-tcp = "0.1"
# Enumerates local network interface IPv4 addresses - needed to build real dialable
# multiaddrs for the TCP listener above, since neither tauri-plugin-tcp nor any other
# installed plugin exposes the device's own IP (see tauriTcpTransport.ts's
# localIpv4Addresses()). Pure Rust (libc getifaddrs on Unix/Android), no native module.
if-addrs = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# helix://bootstrap?addr=<multiaddr> deep links - see app/src/backend/deepLink.ts.
# macOS/Android/iOS get onOpenUrl events straight from this plugin; Windows/Linux
# instead relaunch a second process with the URL as a CLI arg, which single-instance
# below (with its "deep-link" feature) forwards back into the same onOpenUrl event
# path so the frontend only has to handle one code path across every platform.
tauri-plugin-deep-link = "2"

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

