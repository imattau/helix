name: Build Android

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    env:
      # Release-signing secrets, exposed as job env so the signing step's `if:` can
      # reference them (GitHub forbids secrets directly in `if:`). Unset/empty when
      # no keystore is configured yet, in which case the build stays debug-signed.
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust with Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Android NDK
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27
          link-to-sdk: true

      # app/'s frontend imports the backend directly from ../src (see app/vite.config.ts's
      # @helix alias) rather than as a published package, so packages like libp2p,
      # @noble/hashes, and @0xx0lostcause0xx0/polypack resolve from the REPO ROOT's
      # node_modules, not app/'s. Both installs are required.
      - name: Install root (backend) dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # `gen/android` is gitignored (regenerated every run - see src-tauri/.gitignore)
      # so it has to be created before `android build` can use it. `--ci` skips the
      # interactive prompts `init` normally shows on first run.
      - name: Initialize Android project
        working-directory: app
        run: npm run tauri android init -- --ci
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      # Release signing is opt-in, gated on the ANDROID_KEYSTORE_BASE64 secret (create it
      # with scripts/create-android-keystore.sh, then `gh secret set` the printed values).
      # When configured, decode the keystore, write keystore.properties, and patch the
      # generated build.gradle.kts so release APK/AAB builds are signed with the release
      # key. When not configured, the build below falls back to Tauri's auto-generated
      # debug keystore - fine for CI verification, NOT for Play Store release.
      - name: Set up release signing
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          base64 -d <<< "$ANDROID_KEYSTORE_BASE64" > "$RUNNER_TEMP/helix-release.keystore"
          scripts/setup-android-signing.sh "$RUNNER_TEMP/helix-release.keystore" "$ANDROID_KEYSTORE_PASSWORD" "$ANDROID_KEY_ALIAS"

      - name: Build Android APK + AAB
        working-directory: app
        run: npm run tauri android build -- --apk --aab
        env:
          NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - uses: actions/upload-artifact@v4
        with:
          name: helix-android
          path: |
            app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            app/src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
