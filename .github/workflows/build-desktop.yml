name: Build Desktop

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-latest
          - platform: windows-latest
          - platform: macos-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux dependencies (webkit2gtk, etc.)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      # app/'s frontend imports the backend directly from ../src (see app/vite.config.ts's
      # @helix alias) rather than as a published package, so packages like libp2p,
      # @noble/hashes, and @0xx0lostcause0xx0/polypack resolve from the REPO ROOT's
      # node_modules, not app/'s. Both installs are required.
      - name: Install root (backend) dependencies
        run: npm ci

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      # No signing identity is configured for any platform yet (macOS notarization,
      # Windows code signing), so this proves the desktop bundle builds cleanly on
      # all three platforms rather than producing a signed, publishable release
      # artifact. Runs the CLI directly rather than tauri-action so a plain push/PR
      # build never tries to create a GitHub Release - that only makes sense wired
      # to a tag-triggered release workflow, which this project doesn't have yet.
      - name: Build
        working-directory: app
        run: npm run tauri build

      - uses: actions/upload-artifact@v4
        with:
          name: helix-desktop-${{ matrix.platform }}
          path: |
            app/src-tauri/target/release/bundle/**
          if-no-files-found: warn
